<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Employees | Chintamani Enterprises
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dashboard-body">


<header class="top-header">

    <div class="header-brand">

        <img
            src="logo.png"
            alt="Chintamani Enterprises"
        >

        <div>

            <h2>
                CHINTAMANI ENTERPRISES
            </h2>

            <p>
                Owner / Admin Control Room
            </p>

        </div>

    </div>


    <button
        class="logout-button"
        onclick="logout()"
    >
        Logout
    </button>

</header>


<main class="dashboard-container">


    <!-- HEADER -->

    <section class="welcome-section">

        <div>

            <span class="section-label">
                STAFF MANAGEMENT
            </span>

            <h1>
                Employees
            </h1>

            <p>
                Manage your field-service team.
            </p>

        </div>


        <div class="admin-avatar">
            👷
        </div>

    </section>


    <!-- EMPLOYEE STATISTICS -->

    <section class="stats-grid">


        <div class="stat-card">

            <div class="stat-icon">
                👷
            </div>

            <div>

                <strong id="teamCount">
                    0
                </strong>

                <span>
                    Team Members
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ✓
            </div>

            <div>

                <strong id="activeEmployees">
                    0
                </strong>

                <span>
                    Active
                </span>

            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⛔
            </div>

            <div>

                <strong id="inactiveEmployees">
                    0
                </strong>

                <span>
                    Inactive
                </span>

            </div>

        </div>


    </section>


    <!-- EMPLOYEE LIST -->

    <section class="admin-card">


        <div class="card-heading">

            <div>

                <span class="section-label">
                    STAFF
                </span>

                <h2>
                    Team Members
                </h2>

            </div>


            <input
                type="search"
                id="employeeSearch"
                placeholder="Search employee..."
            >

        </div>


        <div id="teamMembers">

            <div class="empty-card">

                <div class="empty-icon">
                    👷
                </div>

                <h3>
                    Loading team...
                </h3>

                <p>
                    Please wait while employee data is loaded.
                </p>

            </div>

        </div>


    </section>


</main>


<nav class="bottom-nav">


    <a
        href="admin.html"
        class="bottom-nav-item"
    >

        <span>🏠</span>

        <small>
            Dashboard
        </small>

    </a>


    <a
        href="admin-jobs.html"
        class="bottom-nav-item"
    >

        <span>📋</span>

        <small>
            Jobs
        </small>

    </a>


    <a
        href="admin-attendance.html"
        class="bottom-nav-item"
    >

        <span>🕐</span>

        <small>
            Attendance
        </small>

    </a>


    <a
        href="admin-employees.html"
        class="bottom-nav-item active"
    >

        <span>👷</span>

        <small>
            Employees
        </small>

    </a>


    <a
        href="admin-profile.html"
        class="bottom-nav-item"
    >

        <span>👤</span>

        <small>
            Profile
        </small>

    </a>


</nav>


<script src="app.js"></script>


<script>

const EMPLOYEE_API =
    "http://localhost:5000/api/employees";

let allEmployees = [];


// ======================================================
// LOAD EMPLOYEES
// ======================================================

async function loadEmployees() {

    const teamContainer =
        document.getElementById(
            "teamMembers"
        );


    try {

        const response =
            await fetch(
                EMPLOYEE_API
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load employees."
            );
        }


        allEmployees =
            data.employees || [];


        updateEmployeeStats(
            allEmployees
        );


        renderEmployees(
            allEmployees
        );


    } catch (error) {

        console.error(
            "Employee loading error:",
            error
        );


        teamContainer.innerHTML = `

            <div class="empty-card">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    Unable to load employees
                </h3>

                <p>
                    ${error.message}
                </p>

            </div>

        `;

    }
}


// ======================================================
// UPDATE STATISTICS
// ======================================================

function updateEmployeeStats(
    employees
) {

    const total =
        employees.length;


    const active =
        employees.filter(
            function (employee) {

                return employee.active === true;

            }
        ).length;


    const inactive =
        total - active;


    document.getElementById(
        "teamCount"
    ).textContent =
        total;


    document.getElementById(
        "activeEmployees"
    ).textContent =
        active;


    document.getElementById(
        "inactiveEmployees"
    ).textContent =
        inactive;
}


// ======================================================
// RENDER EMPLOYEES
// ======================================================

function renderEmployees(
    employees
) {

    const container =
        document.getElementById(
            "teamMembers"
        );


    if (!employees.length) {

        container.innerHTML = `

            <div class="empty-card">

                <div class="empty-icon">
                    👷
                </div>

                <h3>
                    No employees found
                </h3>

                <p>
                    No employee records are currently available.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        employees.map(
            function (employee) {

                const status =
                    employee.active
                        ? "Active"
                        : "Inactive";


                const statusClass =
                    employee.active
                        ? "active"
                        : "inactive";


                return `

                    <div class="admin-card">

                        <div class="profile-grid">


                            <div>

                                <span>
                                    Name
                                </span>

                                <strong>
                                    ${
                                        employee.name ||
                                        "—"
                                    }
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Employee ID
                                </span>

                                <strong>
                                    ${
                                        employee.employeeId ||
                                        "—"
                                    }
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Email
                                </span>

                                <strong>
                                    ${
                                        employee.email ||
                                        "—"
                                    }
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Phone
                                </span>

                                <strong>
                                    ${
                                        employee.phone ||
                                        "—"
                                    }
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Department
                                </span>

                                <strong>
                                    ${
                                        employee.department ||
                                        "Field Service"
                                    }
                                </strong>

                            </div>


                            <div>

                                <span>
                                    Status
                                </span>

                                <strong class="${statusClass}">
                                    ${status}
                                </strong>

                            </div>


                        </div>

                    </div>

                `;

            }
        ).join("");
}


// ======================================================
// SEARCH EMPLOYEES
// ======================================================

function searchEmployees(
    searchText
) {

    const query =
        searchText
            .trim()
            .toLowerCase();


    if (!query) {

        renderEmployees(
            allEmployees
        );

        return;
    }


    const filtered =
        allEmployees.filter(
            function (employee) {

                return (

                    String(
                        employee.name || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        employee.employeeId || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        employee.email || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        employee.phone || ""
                    )
                    .toLowerCase()
                    .includes(query)

                    ||

                    String(
                        employee.department || ""
                    )
                    .toLowerCase()
                    .includes(query)

                );

            }
        );


    renderEmployees(
        filtered
    );
}


// ======================================================
// PAGE INITIALIZATION
// ======================================================

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const search =
            document.getElementById(
                "employeeSearch"
            );


        if (search) {

            search.addEventListener(
                "input",
                function () {

                    searchEmployees(
                        this.value
                    );

                }
            );

        }


        loadEmployees();

    }
);

</script>


</body>

</html>
