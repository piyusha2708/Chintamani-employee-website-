<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Chintamani Enterprises</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="login-body">


<div class="login-wrapper">


    <!-- LOGIN CARD -->

    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            <img
                src="logo.png"
                alt="Chintamani Enterprises Logo"
            >

        </div>


        <!-- COMPANY NAME -->

        <div class="login-brand">

            <h1>
                CHINTAMANI ENTERPRISES
            </h1>

            <p>
                Employee Field Service
            </p>

        </div>


        <!-- TABS -->

        <div class="auth-tabs">

            <button
                type="button"
                id="signInTab"
                class="auth-tab active"
            >
                Sign In
            </button>


            <button
                type="button"
                id="createAccountTab"
                class="auth-tab"
            >
                Create Account
            </button>

        </div>



        <!-- ========================= -->
        <!-- LOGIN FORM -->
        <!-- ========================= -->

        <form
            id="loginForm"
            class="auth-form"
        >


            <div class="form-intro">

                <span class="section-label">
                    STAFF ACCESS
                </span>

                <h2>
                    Welcome Back
                </h2>

                <p>
                    Sign in to access your field-service dashboard.
                </p>

            </div>



            <div class="form-group">

                <label for="loginEmployeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="loginEmployeeId"
                    placeholder="Example: CE001"
                    autocomplete="username"
                    required
                >

            </div>



            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>



            <p
                id="loginError"
                class="form-message error-message"
            ></p>



            <button
                type="submit"
                id="loginBtn"
                class="primary-button full-button"
            >
                Sign In
            </button>



            <div class="login-divider">

                <span>
                    OR
                </span>

            </div>



            <button
                type="button"
                id="googleBtn"
                class="google-button"
            >

                <span>
                    G
                </span>

                Continue with Google

            </button>


        </form>



        <!-- ========================= -->
        <!-- REGISTER FORM -->
        <!-- ========================= -->

        <form
            id="registerForm"
            class="auth-form hidden"
        >


            <div class="form-intro">

                <span class="section-label">
                    NEW STAFF
                </span>

                <h2>
                    Create Account
                </h2>

                <p>
                    Register your employee account to access the system.
                </p>

            </div>



            <div class="form-group">

                <label for="registerEmployeeId">
                    Employee ID
                </label>

                <input
                    type="text"
                    id="registerEmployeeId"
                    placeholder="Example: CE001"
                    required
                >

            </div>



            <div class="form-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter full name"
                    required
                >

            </div>



            <div class="two-column">


                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Email address"
                    >

                </div>



                <div class="form-group">

                    <label for="registerPhone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="Phone number"
                    >

                </div>


            </div>



            <div class="form-group">

                <label for="registerDepartment">
                    Department
                </label>

                <select id="registerDepartment">

                    <option value="Field Service">
                        Field Service
                    </option>

                    <option value="Technical">
                        Technical
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                    <option value="Support">
                        Support
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 4 characters"
                    autocomplete="new-password"
                    required
                >

            </div>



            <p
                id="registerMessage"
                class="form-message"
            ></p>



            <button
                type="submit"
                id="registerBtn"
                class="primary-button full-button"
            >
                Create Account
            </button>


        </form>



        <!-- FOOTER -->

        <div class="login-footer">

            <p>
                Chintamani Enterprises
            </p>

            <span>
                Secure Employee Field Service Portal
            </span>

        </div>


    </div>

</div>



<script src="app.js"></script>

</body>

</html>
